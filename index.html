<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveChat</title>
    <link rel="icon" href="love-logo.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff6b81">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="love-logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
    
    <div class="chat-app" id="auth-section">
        <div class="auth-card">
            <h1 class="auth-title">LoveChat</h1>
            <p class="auth-subtitle">A private space just for us.</p>
            <form id="auth-form" class="auth-step">
                <input type="text" id="auth-name" placeholder="Your Name" class="auth-input" required>
                <input type="tel" id="auth-phone" placeholder="Phone (e.g. +1...)" class="auth-input" required>
                <div id="recaptcha-container" style="margin: 15px 0; display: flex; justify-content: center;"></div>
                <button type="submit" id="auth-submit-btn" class="auth-btn">Send SMS Code</button>
            </form>
            <form id="verify-form" class="auth-step" style="display: none;">
                <p style="margin-bottom: 15px; color: #666;">Enter the 6-digit code.</p>
                <input type="text" id="auth-code" placeholder="6-digit Code" class="auth-input" required>
                <button type="submit" id="verify-submit-btn" class="auth-btn">Verify & Login</button>
                <button type="button" id="cancel-verify-btn" class="auth-toggle">Cancel</button>
            </form>
        </div>
    </div>

    <div class="chat-app" id="inbox-section" style="display: none;">
        <header class="chat-header" id="inbox-header" style="display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <label for="profile-pic-upload" style="cursor: pointer; position: relative;">
                    <div id="my-avatar" class="contact-avatar" style="width: 45px; height: 45px; font-size: 20px; border: 2px solid white;"></div>
                    <div style="position: absolute; bottom: -2px; right: -2px; background: white; border-radius: 50%; padding: 2px 4px; font-size: 10px;">📷</div>
                </label>
                <input type="file" id="profile-pic-upload" accept="image/*" hidden>
                <div style="display: flex; flex-direction: column; align-items: flex-start; text-align: left;">
                    <h2 style="margin:0; font-size: 22px;">Inbox</h2>
                    <span id="inbox-greeting" style="font-size: 13px; opacity: 0.9;"></span>
                </div>
            </div>
            <button id="logout-btn" style="background: transparent; border: none; color: white; cursor: pointer; text-decoration: underline;">Logout</button>
        </header>

        <div class="add-contact-area">
            <form id="add-contact-form" style="display: flex; gap: 10px;">
                <input type="tel" id="new-contact-phone" placeholder="Partner's Phone..." required style="flex: 1; padding: 10px; border-radius: 12px; border: 1px solid #ffd1da; outline: none;">
                <button type="submit" class="auth-btn" style="width: auto; padding: 10px 15px;">Add</button>
                <button type="button" id="device-contacts-btn" class="auth-btn" style="width: auto; padding: 10px 15px; background: #fcfcfc; color: #333; border: 1px solid #ffd1da;" title="Phone Book">📖</button>
                <button type="button" id="open-create-group-btn" class="auth-btn" style="width: auto; padding: 10px 15px; background: #fcfcfc; color: #333; border: 1px solid #ffd1da;" title="Create Group">👥</button>
            </form>
        </div>
        <div class="contact-list" id="contact-list"></div>
    </div>

    <div class="chat-app" id="chat-section" style="display: none;">
        <header class="chat-header" id="chat-header" style="display: flex; align-items: center; gap: 10px;">
            <button id="back-to-inbox-btn" style="background: transparent; border: none; color: white; cursor: pointer; font-size: 20px;">⬅️</button>
            <div id="chat-partner-avatar" class="contact-avatar" style="width: 35px; height: 35px; font-size: 16px; border: 2px solid white;"></div>
            <div style="display: flex; flex-direction: column; align-items: flex-start; text-align: left; flex: 1;">
                <h2 style="margin:0; font-size: 18px; display: flex; align-items: center; cursor: pointer;">
                    <span id="chat-partner-name">Partner</span>
                    <span id="unread-badge" class="unread-badge" style="display: none;">0</span>
                </h2>
            </div>
            <button id="view-map-btn" style="display:none; background: transparent; border: none; cursor: pointer; font-size: 22px;">🗺️</button>
        </header>

        <header class="selection-header" id="selection-header" style="display: none;">
            <button id="cancel-selection-btn" style="background: transparent; border: none; color: white; cursor: pointer; font-size: 18px;">❌</button>
            <span id="selection-count" style="color: white; font-weight: bold; flex: 1; margin-left: 15px;">1 Selected</span>
            <div style="display: flex; gap: 15px;">
                <button id="multi-forward-btn" style="background: transparent; border: none; color: white; cursor: pointer; font-size: 20px;">➡️</button>
                <button id="multi-delete-btn" style="background: transparent; border: none; color: white; cursor: pointer; font-size: 20px;">🗑️</button>
            </div>
        </header>

        <main class="chat-box" id="chat-box"></main>

        <div id="typing-indicator" class="typing-indicator" style="display: none;">
            <span class="typing-text" id="typing-text-name">Partner</span>
            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        </div>

        <div class="quick-emojis" id="quick-emojis">
            <span class="emoji-btn">❤️</span><span class="emoji-btn">😍</span><span class="emoji-btn">😘</span>
            <span class="emoji-btn">👍</span><span class="emoji-btn">👌</span><span class="emoji-btn">🙏</span>
            <span class="emoji-btn">😊</span><span class="emoji-btn">💖</span><span class="emoji-btn">🔥</span><span class="emoji-btn">🌹</span>
        </div>

        <form class="chat-input-area" id="chat-form">
            <label for="image-upload" class="attachment-btn">📷</label>
            <input type="file" id="image-upload" accept="image/*" capture="environment" hidden>
            <label for="video-upload" class="attachment-btn">🎥</label>
            <input type="file" id="video-upload" accept="video/*" capture="camcorder" hidden>
            <label for="file-upload" class="attachment-btn">📎</label>
            <button type="button" id="mic-btn" class="attachment-btn" style="border:none; background:transparent;">🎤</button>
            <button type="button" id="location-btn" class="attachment-btn" style="border:none; background:transparent;">📍</button>
            <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
            <button type="submit">Send</button>
        </form>
    </div>

    <div id="action-sheet-modal" class="modal-overlay" style="display: none;">
        <div class="bottom-sheet">
            <button id="btn-clear-chat" class="sheet-btn delete-btn">⚠️ Clear Entire Chat</button>
            <button id="btn-cancel-action" class="sheet-btn cancel-btn">Cancel</button>
        </div>
    </div>

    <div id="forward-modal" class="modal-overlay" style="display: none;">
        <div class="bottom-sheet" style="max-height: 80vh;">
            <h3 style="text-align: center; margin-bottom: 15px; color: #333;">Forward to...</h3>
            <div id="forward-contact-list" class="contact-list" style="overflow-y: auto; max-height: 50vh;"></div>
            <button id="btn-cancel-forward" class="sheet-btn cancel-btn" style="margin-top: 15px;">Cancel</button>
        </div>
    </div>

    <div id="map-modal" class="modal-overlay" style="display: none;">
        <div class="bottom-sheet" style="height: 75vh; padding: 15px;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="margin: 0; color: #333;">Live Location</h3>
                <button id="close-map-btn" style="background: none; border: none; font-size: 20px; cursor: pointer;">❌</button>
            </div>
            <div id="map-container" style="width: 100%; height: calc(100% - 40px); border-radius: 15px; background: #eee; z-index: 10;"></div>
        </div>
    </div>

    <div id="create-group-modal" class="modal-overlay" style="display: none;">
        <div class="bottom-sheet" style="max-height: 80vh;">
            <h3 style="text-align: center; margin-bottom: 15px; color: #333;">Create New Group</h3>
            <input type="text" id="group-name-input" placeholder="Group Name (e.g., Family)" class="auth-input" style="border: 1px solid #ffd1da;" required>
            <p style="font-size: 14px; color: #666; margin-bottom: 10px;">Select Members:</p>
            <div id="group-contact-list" class="contact-list" style="overflow-y: auto; max-height: 40vh; padding: 0;"></div>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button id="btn-cancel-group" class="sheet-btn cancel-btn" style="flex: 1;">Cancel</button>
                <button id="btn-confirm-group" class="sheet-btn" style="flex: 1; background-color: #ff6b81; color: white;">Create</button>
            </div>
        </div>
    </div>

    <div id="profile-viewer-modal" class="modal-overlay viewer-overlay" style="display: none;">
        <header class="viewer-header">
            <span id="viewer-name">Partner</span>
            <button id="close-viewer-btn">❌</button>
        </header>
        <div class="viewer-body" id="viewer-body">
            <div id="viewer-image" class="viewer-image"></div>
        </div>
        <div class="viewer-controls">
            <button id="zoom-out-btn" class="zoom-btn">➖</button>
            <button id="zoom-in-btn" class="zoom-btn">➕</button>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(e => console.error(e));</script>
    <script type="module" src="app.js"></script>
</body>
</html>
